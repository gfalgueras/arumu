name: Release RPM

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y rpm createrepo-c fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package RPM
        run: npx electron-builder --linux rpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find RPM
        id: rpm
        run: |
          RPM=$(find release/ -name "*.rpm" | head -1)
          echo "path=$RPM" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $RPM)" >> "$GITHUB_OUTPUT"

      - name: Upload RPM as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rpm.outputs.path }}

      - name: Update docs/rpm on main
        run: |
          mkdir -p docs/rpm
          cp "${{ steps.rpm.outputs.path }}" docs/rpm/
          cp packaging/arumu.repo docs/

          cat > docs/install.sh <<'EOF'
          #!/bin/bash
          set -e
          [[ $EUID -ne 0 ]] && { echo "Run as root: sudo bash"; exit 1; }
          curl -fsSL https://gfalgueras.github.io/arumu/arumu.repo \
            -o /etc/yum.repos.d/arumu.repo
          dnf install -y arumu
          echo "Arumu installed."
          EOF

          createrepo_c --update docs/rpm

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add docs/
          git commit -m "rpm: publish ${{ steps.rpm.outputs.name }}"
          git push origin main
