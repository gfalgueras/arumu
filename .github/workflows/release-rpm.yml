name: Release RPM

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      rpm_path: ${{ steps.rpm.outputs.path }}
      rpm_name: ${{ steps.rpm.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('**/package.json') }}

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ hashFiles('electron-builder.yml') }}

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y rpm createrepo-c fakeroot deltarpm || sudo apt-get install -y rpm createrepo-c fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Tests
        run: pnpm test:ci

      - name: Package RPM
        run: npx electron-builder --linux rpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find RPM
        id: rpm
        run: |
          RPM=$(find release/ -name "*.rpm" | head -1)
          echo "path=$RPM" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $RPM)" >> "$GITHUB_OUTPUT"

      - name: Upload RPM artifact for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: arumu-rpm
          path: ${{ steps.rpm.outputs.path }}
          retention-days: 1

      - name: Upload RPM as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rpm.outputs.path }}

      - name: Build Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site/rpm /tmp/old-rpms

          # Download RPMs from last 3 releases for delta generation
          gh release list --limit 3 --json tagName --jq '.[].tagName' | while read tag; do
            gh release download "$tag" --pattern "*.rpm" --dir /tmp/old-rpms/ 2>/dev/null || true
          done

          cp "${{ steps.rpm.outputs.path }}" _site/rpm/
          cp /tmp/old-rpms/*.rpm _site/rpm/ 2>/dev/null || true
          cp packaging/arumu.repo _site/
          if command -v makedeltarpm &>/dev/null; then
            createrepo_c --deltas _site/rpm/
          else
            createrepo_c _site/rpm/
          fi

          cat > _site/install.sh <<'EOF'
          #!/bin/bash
          set -e
          [[ $EUID -ne 0 ]] && { echo "Run as root: sudo bash"; exit 1; }
          curl -fsSL https://gfalgueras.github.io/arumu/arumu.repo \
            -o /etc/yum.repos.d/arumu.repo
          dnf install -y arumu
          echo "Arumu installed."
          EOF

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Arumu — DNF Repository</title></head>
          <body>
          <h1>Arumu SQL Manager</h1>
          <h2>Install (Fedora / RHEL)</h2>
          <pre><code>sudo curl -fsSL https://gfalgueras.github.io/arumu/install.sh | bash</code></pre>
          <h2>Manual</h2>
          <pre><code>sudo curl -o /etc/yum.repos.d/arumu.repo https://gfalgueras.github.io/arumu/arumu.repo
          sudo dnf install arumu</code></pre>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  smoke-test-fedora:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: arumu-rpm
          path: /tmp/rpm

      - name: Install RPM
        run: dnf install -y /tmp/rpm/*.rpm

      - name: Smoke test (headless)
        run: |
          dnf install -y xorg-x11-server-Xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          DISPLAY=:99 timeout 8 arumu --no-sandbox 2>&1 | tee /tmp/arumu.log || true
          # Fail if any "Cannot find module" or JS error in output
          if grep -q "Cannot find module\|ReferenceError\|Uncaught Exception" /tmp/arumu.log; then
            echo "SMOKE TEST FAILED — startup error detected:"
            cat /tmp/arumu.log
            exit 1
          fi
          echo "Smoke test passed"

  deploy:
    needs: [build, smoke-test-fedora]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
