name: Release RPM

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      rpm_path: ${{ steps.rpm.outputs.path }}
      rpm_name: ${{ steps.rpm.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y rpm createrepo-c fakeroot

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Package RPM
        run: npx electron-builder --linux rpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find RPM
        id: rpm
        run: |
          RPM=$(find release/ -name "*.rpm" | head -1)
          echo "path=$RPM" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $RPM)" >> "$GITHUB_OUTPUT"

      - name: Upload RPM as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rpm.outputs.path }}

      - name: Build Pages site
        run: |
          mkdir -p _site/rpm
          cp "${{ steps.rpm.outputs.path }}" _site/rpm/
          cp packaging/arumu.repo _site/
          createrepo_c _site/rpm

          cat > _site/install.sh <<'EOF'
          #!/bin/bash
          set -e
          [[ $EUID -ne 0 ]] && { echo "Run as root: sudo bash"; exit 1; }
          curl -fsSL https://gfalgueras.github.io/arumu/arumu.repo \
            -o /etc/yum.repos.d/arumu.repo
          dnf install -y arumu
          echo "Arumu installed."
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
