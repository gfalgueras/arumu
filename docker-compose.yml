services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: arumu
      POSTGRES_PASSWORD: arumu
      POSTGRES_DB: arumu_test
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arumu"]
      interval: 10s
      timeout: 5s
      retries: 12

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: Arumu_Test1
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql
      - ./docker/sqlserver/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Arumu_Test1' -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20

  oracle:
    image: gvenzl/oracle-xe:21-slim
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: arumu_test
      APP_USER_PASSWORD: arumu_test
    ports:
      - "1521:1521"
    volumes:
      - ./docker/oracle/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s arumu_test/arumu_test@localhost/XEPDB1 | grep -q 1"]
      interval: 30s
      timeout: 15s
      retries: 20

# Connection details for Arumu:
#
# MySQL
#   Host: localhost  Port: 3306  User: root  Password: root
#   Databases: arumu_test, arumu_analytics
#
# PostgreSQL
#   Host: localhost  Port: 5432  User: arumu  Password: arumu
#   Databases: arumu_test, arumu_analytics
#
# SQL Server
#   Host: localhost  Port: 1433  User: sa  Password: Arumu_Test1
#   Databases: arumu_test, arumu_analytics
#
# Oracle
#   Host: localhost  Port: 1521  User: arumu_test  Password: arumu_test
#   Database (service): XEPDB1
#   Schema data lives in: ARUMU_TEST
