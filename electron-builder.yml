appId: com.arumu.app
productName: Arumu
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - '!**/*.map'
win:
  target: nsis
mac:
  target: dmg
linux:
  target:
    - AppImage
    - rpm
  category: Development
  description: Desktop MySQL manager — query editor, table browser, schema editor
  maintainer: Gin Falgueras <ginardfalgueras@gmail.com>
rpm:
  depends:
    - libxcb
    - libXScrnSaver
    - gtk3
    - nss
    - xdg-utils
